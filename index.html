<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Grade Calculator</h1>
    <form id="gradeForm">
        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" name="studentName" required>
        <br><br>
           <label for="maths">Maths Marks:</label>
    <input type="number" id="maths" min="0" max="100" required>
    <br><br>

    <label for="english">English Marks:</label>
    <input type="number" id="english" min="0" max="100" required>
    <br><br>

    <label for="science">Science Marks:</label>
    <input type="number" id="science" min="0" max="100" required>
    <br><br>
        <button type="submit">Calculate Average</button>
    </form>
    <p id="result"></p>
    <script src="script.js"></script>
</body>
</html>
